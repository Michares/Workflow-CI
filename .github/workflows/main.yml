name: ML Model CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.3.3 numpy==2.4.6 matplotlib==3.10.9 seaborn==0.13.2 joblib==1.5.3

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=file:./mlruns" >> $GITHUB_ENV
          echo "Tracking URI di-set ke file:./mlruns"

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local --experiment-name "CI_Build"

      - name: Get latest MLflow run ID
        id: get_run
        working-directory: MLProject
        run: |
          RUN_ID=$(python -c "
          import mlflow
          mlflow.set_tracking_uri('file:./mlruns')
          client = mlflow.MlflowClient()
          exp = client.get_experiment_by_name('CI_Build')
          runs = client.search_runs(exp.experiment_id, order_by=['attribute.start_time DESC'])
          print(runs[0].info.run_id)
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Latest Run ID: $RUN_ID"

      - name: Install Python dependencies for artifact handling
        run: |
          pip install --upgrade pip

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifacts
          path: MLProject/mlruns/
          retention-days: 30

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker Model
        working-directory: MLProject
        run: |
          mlflow models build-docker --model-uri "runs:/${{ steps.get_run.outputs.RUN_ID }}/model" --name personality-classifier

      - name: Tag Docker Image
        run: |
          docker tag personality-classifier ${{ secrets.DOCKER_HUB_USERNAME }}/personality-classifier:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/personality-classifier:latest

      - name: Complete job
        run: echo "ML CI/CD pipeline completed successfully"